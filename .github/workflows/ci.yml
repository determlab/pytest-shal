name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pin pyshal to shal main (record_version 3, shal#409/pytest-shal#39)
        # Do not wait for a PyPI release, and do not change the released
        # `pyshal>=0.3.0,<0.5` range in pyproject.toml for this -- this
        # override is test/CI-only, the same pattern other tickets use.
        run: pip install "pyshal @ git+https://github.com/determlab/shal@a799eaada20aa4071dcfef38df86d6ffdaf94db5"
      - name: Test
        run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy --strict src
